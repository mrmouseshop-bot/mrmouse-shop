name: Обновить офлайн-версию сайта

on:
  # К4: автогенерация по расписанию отключена — ссылка на offline.html
  # убрана из интерфейса сайта (заменена на уже существующий price-list.pdf),
  # регулярно пересобирать его больше незачем. Сам скрипт и файл остаются
  # в репозитории на случай, если понадобится собрать вручную (например,
  # переслать кому-то актуальный офлайн-снимок) — для этого используйте
  # кнопку "Run workflow" во вкладке Actions.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install requests Pillow

      - name: Собрать offline.html
        run: python build_offline_snapshot.py
        env:
          NOCODB_TOKEN: ${{ secrets.NOCODB_TOKEN }}

      - name: Подтянуть свежие изменения (на случай правок во время сборки)
        run: git pull --rebase --autostash origin main

      - name: Закоммитить обновлённый файл
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Автообновление офлайн-версии сайта'
          file_pattern: offline.html
